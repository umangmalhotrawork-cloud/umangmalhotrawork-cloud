<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" fill="none" width="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
  </defs>

  <style>
    @keyframes heroFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes tracePath {
      from { stroke-dashoffset: 180; }
      to { stroke-dashoffset: 0; }
    }
    .hero-wrap {
      animation: heroFadeIn 0.8s ease-out 1 forwards;
    }
    .trace-line {
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: tracePath 1.2s ease-out 1 forwards;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
  </style>

  <g class="hero-wrap">
    <!-- Container Card -->
    <rect x="0.5" y="0.5" width="849" height="139" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

    <!-- Terminal Window Bar -->
    <path d="M 0.5 8.5 Q 0.5 0.5 8.5 0.5 L 841.5 0.5 Q 849.5 0.5 849.5 8.5 L 849.5 32.5 L 0.5 32.5 Z" fill="#161b22" />
    <line x1="0.5" y1="32.5" x2="849.5" y2="32.5" stroke="#21262d" stroke-width="1" />

    <!-- Control Dots (Monochrome Slate) -->
    <circle cx="22" cy="16.5" r="4" fill="#30363d" />
    <circle cx="36" cy="16.5" r="4" fill="#30363d" />
    <circle cx="50" cy="16.5" r="4" fill="#30363d" />

    <!-- Terminal Title -->
    <text x="72" y="20.5" fill="#8b949e" font-size="11.5" class="mono">umangmalhotra@system-core: ~/intelligent-systems</text>

    <!-- Top Right Status Badge -->
    <rect x="716" y="7.5" width="120" height="18" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <circle cx="728" cy="16.5" r="3" fill="#58a6ff" />
    <text x="738" y="20" fill="#8b949e" font-size="9.5" font-weight="600" class="mono">AI / ML • C++20</text>

    <!-- Monogram Identity Frame -->
    <rect x="22" y="46" width="74" height="74" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />

    <!-- Monogram Glyphs: U and M -->
    <path class="trace-line" d="M 34 62 L 34 90 Q 34 100 44 100 L 46 100 Q 56 100 56 90 L 56 62" fill="none" stroke="url(#accentGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <path class="trace-line" d="M 62 100 L 62 62 L 73 80 L 84 62 L 84 100" fill="none" stroke="#e6edf3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="59" y="113" text-anchor="middle" fill="#8b949e" font-size="7.5" font-weight="600" class="mono" letter-spacing="1.2">CORE</text>

    <!-- Code & Architecture Lines -->
    <!-- Line 1: Code Expression -->
    <text x="114" y="65" class="mono" font-size="12">
      <tspan fill="#58a6ff">&gt; </tspan>
      <tspan fill="#ff7b72">const auto </tspan>
      <tspan fill="#e6edf3">engine </tspan>
      <tspan fill="#79c0ff">= </tspan>
      <tspan fill="#79c0ff">std::make_unique</tspan>
      <tspan fill="#d2a8ff">&lt;IntelligentSystem&gt;</tspan>
      <tspan fill="#e6edf3">();</tspan>
    </text>

    <!-- Line 2: Pipeline Domain Subtitle -->
    <text x="114" y="88" class="mono" font-size="11.5">
      <tspan fill="#8b949e">[PIPELINE] </tspan>
      <tspan fill="#c9d1d9">Real-Time Computer Vision </tspan>
      <tspan fill="#484f58">|</tspan>
      <tspan fill="#c9d1d9"> Agentic Tooling </tspan>
      <tspan fill="#484f58">|</tspan>
      <tspan fill="#c9d1d9"> Predictive Modeling</tspan>
    </text>

    <!-- Line 3: Tech Stack -->
    <text x="114" y="110" class="mono" font-size="11.5">
      <tspan fill="#8b949e">[STACK]    </tspan>
      <tspan fill="#7ee787">C++20</tspan>
      <tspan fill="#8b949e"> • </tspan>
      <tspan fill="#79c0ff">FastAPI</tspan>
      <tspan fill="#8b949e"> • </tspan>
      <tspan fill="#ffa657">PyTorch</tspan>
      <tspan fill="#8b949e"> • </tspan>
      <tspan fill="#58a6ff">Next.js</tspan>
      <tspan fill="#8b949e"> • </tspan>
      <tspan fill="#d2a8ff">Docker</tspan>
    </text>

    <!-- Right Side Engineering Focus Card -->
    <rect x="710" y="46" width="126" height="74" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="720" y="62" fill="#c9d1d9" font-size="9.5" class="mono">• AI / ML</text>
    <text x="720" y="77" fill="#c9d1d9" font-size="9.5" class="mono">• C++20</text>
    <text x="720" y="92" fill="#c9d1d9" font-size="9.5" class="mono">• Computer Vision</text>
    <text x="720" y="107" fill="#79c0ff" font-size="9.5" class="mono">• Agentic Systems</text>
  </g>
</svg>
